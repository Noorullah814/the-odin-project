<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <title>Sign Up form</title>
</head>

<body>
    <main>
        <section class="branding-section">
            <div class="branding-logo">
                <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40"
                    aria-hidden="true">

                    <path d="M22 16L10 32L22 48" fill="none" stroke="currentColor" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round" />

                    <path d="M42 16L54 32L42 48" fill="none" stroke="currentColor" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round" />

                    <path d="M36 12L28 52" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />

                </svg>

                <span class="brand-name">DevForge</span>
            </div>
            <h1>Build your <br> developer future.</h1>
            <p class="description">The forge where code becomes craft. Join <br> thousands of engineers scaling global
                <br> infrastructure.
            </p>
            <small>Photo credit by Unsplash.</small>
        </section>
        <section class="signup-section">
            <div class="form-header">
                <h2 class="heading">Create your account</h2>
                <p class="description">Join the elite community of developers building the future.</p>
            </div>
            <form>
                <div class="name-section">
                    <div class="field">
                        <label for="first-name">First Name</label>
                        <input type="text" name="first-name" id="first-name" placeholder="John" required>
                    </div>
                    <div class="field">
                        <label for="last-name">Last Name</label>
                        <input type="text" name="last-name" id="last-name" placeholder="Doe" required>
                    </div>
                </div>

                <div class="contact-section">
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="field">
                        <label for="phone-number">Contact Number</label>
                        <input type="tel" name="phone-number" id="phone-number" placeholder="+92 (000) 000-0000"
                            required>
                    </div>
                </div>

                <div class="security-section">
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" placeholder="********" required>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" name="confirm-password" id="confirm-password" placeholder="********"
                            required>
                    </div>
                </div>

                <div class="terms-section">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the Terms of Service and Privacy Policy.
                    </label>
                </div>

                <div class="action-section">
                    <div class="action-field">
                        <button type="submit">Create Account</button>
                    </div>
                    <div class="action-field">
                        <p>Already have an account? <a href="#">Log in</a></p>
                    </div>
                </div>

            </form>
        </section>
    </main>
</body>

</html>
